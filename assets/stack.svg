<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="What I build: frontend with Next.js, React, TypeScript and Tailwind; mobile with React Native and Expo; backend with Node, Express, Python and FastAPI; databases with PostgreSQL, Supabase, SQLite and Firebase; AI with Gemini and LangGraph.">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F43F5E"/>
    <stop offset=".5" stop-color="#A78BFA"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <style>
    .t{font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}
    .h{font-size:15px;font-weight:700;fill:#F9FAFB}
    .i{font-size:13px;fill:#9CA3AF}
    .m{font-family:Consolas,'SF Mono',Menlo,monospace;font-size:11px;fill:#6B7280}
  </style>
</defs>
<rect x=".5" y=".5" width="879" height="209" rx="18" fill="#0B0B10" stroke="#26262F"/>
<text x="28" y="36" class="m">// what I build</text>
<rect x="28" y="46" width="824" height="2" rx="1" fill="url(#accent)" opacity=".7"/>

